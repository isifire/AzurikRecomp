name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  import-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_public.py
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile launcher without game files
        shell: cmd
        run: Compilar-Lanzador.bat
      - name: Test source selector without launching game
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:tests\TestLauncherSource.exe tests\TestLauncherSource.cs
          tests\TestLauncherSource.exe
